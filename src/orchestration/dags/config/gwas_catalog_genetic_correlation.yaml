---
# ── Environment variable substitution ─────────────────────────────────────────
#
# Sentinels in the form {name} are replaced at DAG parse time with the value
# from the active environment_spec.
#
environment_specs:
  - name: Test
    vars:
      sumstats_path: gs://gwas_catalog_inputs/harmonised_summary_statistics
      ldscore_base_path: gs://genetics-portal-dev-analysis/xg1/LDSC_pyspark/inputs/custom_panel
      study_index_path: gs://gwas_catalog_sumstats_susie/study_index/
      outputs_dir: gs://genetics-portal-dev-analysis/xg1/LDSC_pyspark/outputs/gentropy_all_sumstats_2606
      gentropy_image: europe-west1-docker.pkg.dev/open-targets-genetics-dev/opentargets/gentropy:3.3.0-dev.64

  - name: Prod
    vars:
      sumstats_path: gs://gwas_catalog_inputs/harmonised_summary_statistics
      ldscore_base_path: gs://genetics-portal-dev-analysis/xg1/LDSC_pyspark/inputs/custom_panel
      study_index_path: gs://gwas_catalog_sumstats_susie/study_index/
      outputs_dir: gs://genetics-portal-dev-analysis/xg1/LDSC_pyspark/outputs/gentropy_all_sumstats_2606
      gentropy_image: europe-west1-docker.pkg.dev/open-targets-genetics-dev/opentargets/gentropy:3.3.0-dev.64

env: Test

# ── Dataproc cluster (stage 1: manifest generation only) ──────────────────────
#
# Stage 1: representative_study_manifest — reads the study index and heritability
#   estimates via Spark, selects one representative per (diseaseId, ancestry) cell,
#   and writes all_pairs.csv to GCS.
#
dataproc:
  cluster_name: otg-ldsc-rg
  cluster_config:
    project_id: open-targets-genetics-dev
    metadata:
      GENTROPY_REF: 3.3.0-dev.14
    master_disk_size: 500
    num_workers: 4
    init_actions_uris:
      - 'gs://genetics_etl_python_playground/initialisation/install_dependencies_on_cluster.sh'

nodes:
  - id: rg_representative_manifest
    kind: Task
    prerequisites: []
    params:
      step: representative_study_manifest
      step.study_index_path: '{study_index_path}'
      step.heritability_estimates_path: '{outputs_dir}/heritability_estimates'
      step.sumstats_base_path: '{sumstats_path}'
      step.manifest_output_path: '{outputs_dir}/manifest/all_pairs.csv'
      step.session.write_mode: overwrite

# ── Google Batch (stage 2: genetic correlations) ──────────────────────────────
#
# The manifest generator reads all_pairs.csv, splits it into chunks and stages
# chunk CSVs to GCS.  Each Batch task reads harmonised summary statistics and
# LD scores directly from GCS, runs LDSC rg for every pair in the chunk, and
# writes a result parquet.  No intermediate munged files are stored.
#
# Machine: n2-highmem-4 (4 vCPU, 32 GB RAM) — sized to hold two full-genome
#   sumstats plus a ~1 GB LD-score file in memory.
#
# Throughput with default chunk_size=5:
#   274 k pairs / 5 = ~55 k tasks; at 200 parallel → ~275 rounds.
#   Each task: 1-2 min LD read (once) + ~5 reads × 1 min = ~7 min.
#   Total wall time ≈ 275 × 7 min ≈ 32 h.
#   Increase parallelism or chunk_size to trade memory for speed.
#
rg_batch_index_specs:
  pointer: genetic_correlation
  max_task_count: 10000
  generator_specs:
    generator_options:
      manifest_path: '{outputs_dir}/manifest/all_pairs.csv'
      output_prefix: '{outputs_dir}/genetic_correlations'
      chunks_staging_path: '{outputs_dir}/rg_chunks'
      chunk_size: 5

rg_batch:
  job:
    task_group:
      parallelism: 200
      task_environments:
        environments: [] # populated at runtime by BatchIndexOperator
      task_config:
        max_retry_count: 1
        max_run_duration: "1h"
        instance_resource_spec:
          cpu_milli: 4000
          memory_mib: 26000
          boot_disk_mib: 32000
        runnable_spec:
          image_uri: "{gentropy_image}"
          entrypoint: /usr/bin/bash
          inline_commands:
            - '-c'
            # yamllint disable rule:line-length
            - >-
              gentropy step=genetic_correlation_chunk step.session.write_mode=overwrite step.session.output_partitions=1 step.chunk_manifest_path=$INPUT_PARTITION step.ldscore_base_path={ldscore_base_path} step.rg_output_path=$OUTPUT_PARTITION "+step.session.extended_spark_conf={spark.jars:https://storage.googleapis.com/hadoop-lib/gcs/gcs-connector-hadoop3-latest.jar,spark.hadoop.fs.gs.requester.pays.mode:CUSTOM,spark.hadoop.fs.gs.requester.pays.buckets:open-targets-data-releases,spark.hadoop.fs.gs.requester.pays.project.id:open-targets-genetics-dev,spark.driver.memory:4g,spark.executor.memory:4g}"
            # yamllint enable rule:line-length
    allocation:
      instance:
        machine_type: n2-highmem-4
        provisioning_model: SPOT
    logs: {}
