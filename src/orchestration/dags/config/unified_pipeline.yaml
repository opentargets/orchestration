release_name: '25.09'
# If `is_dev` is true:
#   * the bucket used for the run will be `open-targets-pipeline-runs`
#   * the prefix inside the bucket will be `run_name`
#         which defaults to a timestamp if not provided.
is_dev: true
run_name: 'jferrer/test-edp-1'
# Whether this will be a partner preview platform release (PPP)
is_ppp: false
# Versions for software and data
pis_version: '25.2.3.dev.18'
pts_version: '25.3.0-dev.11'
etl_version: '25.2.0-rc.1'
gentropy_version: '2.4.2-rc.4'
vep_version: 'release_115.2'
chembl_version: '36'
efo_version: '3.83.0'
ensembl_version: '115'
gencode_version: '49'
depmap_version: '2025Q2'
hpo_version: '2025-01-16'
mondo_version: '2025-02-04'
ot_curation: '25.12'
probes_drugs_version: '02_2025'
# Dependency graph
# ----------------
# The following section defines the dependencies between the different steps in
# the pipeline.
#
# IMPORTANT: any dependency change has to be reflected here _manually_.
#
# IMPORTANT: only direct dependencies are defined. Take care when removing one,
#      and always double check if instead of just deleting, you have to change
#      it for another step that is further upstream.
#
# Note: steps that can run in parallel are separated in blocks by a blank line,
#      which means each block depends on the previous block.
#
# It could be possible to generate this automatically from the file input for
# each step, but given the current fast pace of changes throughout the whole
# pipeline, it is not worth the effort to implement this until things have
# stabilised.
#
steps:
  # PIS STEPS
  pis_biosample:
  pis_disease:
  pis_drug:
  pis_impc: # TODO
  pis_evidence_expression_atlas:
  pis_evidence_cancer_biomarkers:
  pis_evidence_chembl:
  pis_evidence_clingen:
  pis_evidence_cosmic:
  pis_evidence_project_score:
  pis_evidence_crispr_screens:
  pis_evidence_eva:
  pis_evidence_gene_burden:
  pis_evidence_gene2phenotype:
  pis_evidence_panel_app:
  pis_evidence_orphanet:
  pis_evidence_reactome:
  pis_evidence_uniprot_literature:
  pis_evidence_uniprot_variants:
  pis_evidence_ppp:
    ppp_only: true
  pis_expression:
  pis_go:
  pis_interaction:
  pis_l2g:
  pis_literature:
  pis_openfda:
  pis_otar:
    ppp_only: true
  pis_pharmacogenetics:
  pis_reactome:
  pis_so:
  pis_target:
  pis_target_engine:
  # PTS STEPS
  pts_disease:
    depends_on:
      - pis_disease
  pts_expression:
    depends_on:
      - pis_expression
  pts_mouse_phenotype:
    depends_on:
      - etl_target
  pts_chemical_probes:
    depends_on:
      - pis_target
  pts_coding_variant:
    depends_on:
      - gentropy_variant
      - etl_target
      - pts_disease
      - etl_evidence_eva
      - etl_evidence_uniprot_variants
      - etl_evidence_gwas_credible_set
      - etl_pharmacogenetics
  pts_openfda:
    depends_on:
      - pis_openfda
  pts_so:
    depends_on:
      - pis_so
  pts_target:
    depends_on:
      - pis_target
      - pis_impc # TODO
  pts_pharmacogenetics:
    depends_on:
      - pis_pharmacogenetics
  pts_evidence_project_score:
    depends_on:
      - pis_evidence_project_score
  pts_evidence_gene_burden:
    depends_on:
      - pis_evidence_gene_burden
  pts_evidence_chembl:
    depends_on:
      - pis_evidence_chembl
      - pis_drug
  pts_evidence_cancer_biomarkers:
    depends_on:
      - pis_evidence_cancer_biomarkers
  pts_evidence_orphanet:
    depends_on:
      - pis_evidence_orphanet
  pts_evidence_clingen:
    depends_on:
      - pis_evidence_clingen
  pts_evidence_impc:
    depends_on:
      - pis_impc # TODO
  pts_evidence_panel_app:
    depends_on:
      - pis_evidence_panel_app
  pts_evidence_crispr_screens:
    depends_on:
      - pis_evidence_crispr_screens
  pts_evidence_gene2phenotype:
    depends_on:
      - pis_evidence_gene2phenotype
  pts_evidence_ppp:
    ppp_only: true
    depends_on:
      - pis_evidence_ppp
  pts_timeseries:
    depends_on:
      - pts_disease
      - etl_evidence_impc
      - etl_evidence_epmc
      - etl_evidence_gwas_credible_set
      - etl_evidence_expression_atlas
      - etl_evidence_cancer_biomarkers
      - etl_evidence_chembl
      - etl_evidence_clingen
      - etl_evidence_cosmic
      - etl_evidence_project_score
      - etl_evidence_crispr_screens
      - etl_evidence_eva
      - etl_evidence_gene_burden
      - etl_evidence_gene2phenotype
      - etl_evidence_panel_app
      - etl_evidence_orphanet
      - etl_evidence_reactome
      - etl_evidence_uniprot_literature
      - etl_evidence_uniprot_variants
    depends_on_ppp:
      - etl_evidence_ppp
  # ETL STEPS
  etl_expression:
    num_partitions: 4
    depends_on:
      - pts_expression
  etl_go:
    num_partitions: 1
    depends_on:
      - pis_go
  etl_reactome:
    num_partitions: 1
    depends_on:
      - pis_reactome
  etl_otar:
    ppp_only: true
    depends_on:
      - pis_otar
      - pts_disease
  etl_target:
    num_partitions: 10
    depends_on:
      - pts_disease
      - pts_target
      - etl_reactome
  etl_drug:
    num_partitions: 1
    depends_on:
      - pis_drug
      - pts_disease
      - etl_target
  etl_search_facet:
    depends_on:
      - pts_disease
      - etl_go
      - etl_target
  etl_interaction:
    depends_on:
      - pis_interaction
      - etl_target
  etl_openfda:
    depends_on:
      - pts_openfda
      - etl_drug
  etl_literature:
    num_partitions: 1000
    depends_on:
      - pis_literature
      - etl_drug
  etl_pharmacogenetics:
    num_partitions: 1
    depends_on:
      - pts_pharmacogenetics
      - etl_drug
  etl_target_engine:
    depends_on:
      - pis_target_engine
      - etl_drug
  etl_evidence_impc:
    num_partitions: 100
    depends_on:
      - pts_evidence_impc
  etl_evidence_epmc:
    depends_on:
      - etl_literature
  etl_evidence_gwas_credible_set:
    depends_on:
      - gentropy_l2g_evidence
  etl_evidence_expression_atlas:
    depends_on:
      - pis_evidence_expression_atlas
  etl_evidence_cancer_biomarkers:
    depends_on:
      - pts_evidence_cancer_biomarkers
  etl_evidence_chembl:
    depends_on:
      - pts_evidence_chembl
  etl_evidence_clingen:
    depends_on:
      - pts_evidence_clingen
  etl_evidence_cosmic:
    depends_on:
      - pis_evidence_cosmic
  etl_evidence_project_score:
    depends_on:
      - pts_evidence_project_score
  etl_evidence_crispr_screens:
    depends_on:
      - pts_evidence_crispr_screens
  etl_evidence_eva:
    depends_on:
      - pis_evidence_eva
  etl_evidence_gene_burden:
    depends_on:
      - pts_evidence_gene_burden
  etl_evidence_gene2phenotype:
    depends_on:
      - pts_evidence_gene2phenotype
  etl_evidence_panel_app:
    depends_on:
      - pts_evidence_panel_app
  etl_evidence_orphanet:
    depends_on:
      - pts_evidence_orphanet
  etl_evidence_reactome:
    depends_on:
      - pis_evidence_reactome
  etl_evidence_uniprot_literature:
    depends_on:
      - pis_evidence_uniprot_literature
  etl_evidence_uniprot_variants:
    depends_on:
      - pis_evidence_uniprot_variants
  etl_evidence_ppp:
    ppp_only: true
    depends_on:
      - pis_evidence_ppp
  etl_association:
    depends_on:
      - etl_evidence_impc
      - etl_evidence_epmc
      - etl_evidence_gwas_credible_set
      - etl_evidence_expression_atlas
      - etl_evidence_cancer_biomarkers
      - etl_evidence_chembl
      - etl_evidence_clingen
      - etl_evidence_cosmic
      - etl_evidence_project_score
      - etl_evidence_crispr_screens
      - etl_evidence_eva
      - etl_evidence_gene_burden
      - etl_evidence_gene2phenotype
      - etl_evidence_panel_app
      - etl_evidence_orphanet
      - etl_evidence_reactome
      - etl_evidence_uniprot_literature
      - etl_evidence_uniprot_variants
    depends_on_ppp:
      - etl_evidence_ppp
  etl_association_otf:
    depends_on:
      - etl_evidence_impc
      - etl_evidence_epmc
      - etl_evidence_gwas_credible_set
      - etl_evidence_expression_atlas
      - etl_evidence_cancer_biomarkers
      - etl_evidence_chembl
      - etl_evidence_clingen
      - etl_evidence_cosmic
      - etl_evidence_project_score
      - etl_evidence_crispr_screens
      - etl_evidence_eva
      - etl_evidence_gene_burden
      - etl_evidence_gene2phenotype
      - etl_evidence_panel_app
      - etl_evidence_orphanet
      - etl_evidence_reactome
      - etl_evidence_uniprot_literature
      - etl_evidence_uniprot_variants
    depends_on_ppp:
      - etl_evidence_ppp
  etl_known_drug:
    num_partitions: 2
    depends_on:
      - etl_evidence_chembl
  etl_search:
    depends_on:
      - etl_association
      - gentropy_variant
  etl_search_ebi:
    depends_on:
      - etl_association
  # GENTROPY STEPS
  gentropy_biosample:
    depends_on:
      - pis_biosample
  gentropy_study:
    depends_on:
      - pts_target
      - pts_disease
      - etl_target
      - gentropy_biosample
  gentropy_credible_set:
    depends_on:
      - gentropy_study
  gentropy_colocalisation_colocpip_and_ecaviar:
    depends_on:
      - gentropy_credible_set
  gentropy_variant_partition:
    depends_on:
      - etl_evidence_uniprot_variants
      - etl_evidence_eva
      - etl_pharmacogenetics
      - gentropy_credible_set
  gentropy_variant_annotation:
    depends_on:
      - gentropy_variant_partition
  gentropy_variant:
    depends_on:
      - gentropy_variant_annotation
  gentropy_l2g_feature_matrix:
    depends_on:
      - gentropy_colocalisation_colocpip_and_ecaviar
      - gentropy_variant
  gentropy_l2g_training:
    depends_on:
      - pis_l2g
      - etl_interaction
      - gentropy_credible_set
      - gentropy_variant
      - gentropy_l2g_feature_matrix
  gentropy_l2g_prediction:
    depends_on:
      - gentropy_l2g_feature_matrix
      - gentropy_l2g_training
  gentropy_l2g_evidence:
    depends_on:
      - gentropy_l2g_prediction
